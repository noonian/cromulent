name: CI
on:
  push:
  pull_request:

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - run: clojure -M:test

  jolt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        # Homebrew is preinstalled on the ubuntu-24.04 image but not on PATH
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap jolt-lang/jolt
          brew install jolt
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - run: jolt -M:test
